
name: Build Geode Mod

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: Win64
          - platform: macOS
            os: macos-latest
            target: MacOS
          - platform: Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: .
          sdk: v6.0.0-alpha.1
          target: ${{ matrix.target }}
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: how-to-ruin-gd-${{ matrix.platform }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
